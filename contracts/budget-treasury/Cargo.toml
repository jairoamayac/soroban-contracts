[package]
name = "budget-treasury"
description = "Reference implementation of Proof of Spend: budget lines per funding source, and expenses and payments recorded against them with two signers, an accounting code and a supporting document."
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
truway-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
